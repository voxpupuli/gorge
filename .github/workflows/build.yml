---
name: build

on:
  pull_request: {}
  push:
    branches:
      - main

permissions:
  contents: read

env:
  go_version: '1.25'

jobs:
  golangci-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.7

  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.go_version }}
      - name: Test
        run: go test -v ./...

  goreleaser:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.go_version }}
      - name: Set up QEMU for cross-platform Docker buildx
        uses: docker/setup-qemu-action@v4
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de
        with:
          distribution: goreleaser
          version: '~> 2'
          args: release --snapshot --clean
      - name: Run gorge
        run: ./dist/gorge_linux_amd64_v1/gorge version

  tests:
    needs:
      - golangci-lint
      - test
      - goreleaser
    runs-on: ubuntu-24.04
    name: Test suite
    steps:
      - run: echo Test suite completed
